
name: Daily SkillSpector Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out SkillSpector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SkillSpector
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SKILLSPECTOR_APP_ID }}
          private-key: ${{ secrets.SKILLSPECTOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Discover and clone repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repos reports

          gh api --paginate /installation/repositories \
            --jq '.repositories[].full_name' > repositories.txt

          APP_TOKEN="$GH_TOKEN"
          unset GH_TOKEN

          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            slug="${repo//\//_}"
            echo "Cloning $repo"

            if ! GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
              git clone --depth=1 "https://github.com/$repo.git" "repos/$slug"; then
              echo "$repo" >> clone-failures.txt
            fi
          done < repositories.txt

          unset APP_TOKEN

      - name: Scan discovered AI skill directories
        shell: bash
        run: |
          set -uo pipefail
          scanned=0
          skipped=0
          failed=0

          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            slug="${repo//\//_}"
            target="repos/$slug"

            if [ ! -d "$target" ]; then
              failed=$((failed + 1))
              continue
            fi

            index=0
            found=0

            while IFS= read -r -d '' skill_file; do
              found=1
              index=$((index + 1))
              report="reports/${slug}-skill-${index}.json"

              echo "Scanning $repo: $skill_file"

              if skillspector scan "$(dirname "$skill_file")" \
                --no-llm --format json --output "$report"; then
                scanned=$((scanned + 1))
              else
                if [ -s "$report" ]; then
                  scanned=$((scanned + 1))
                else
                  failed=$((failed + 1))
                fi
              fi
            done < <(find "$target" -type f -name SKILL.md \
              -not -path '*/.git/*' -print0)

            if [ "$found" -eq 0 ]; then
              skipped=$((skipped + 1))
            fi
          done < repositories.txt

          {
            echo "# Daily SkillSpector Scan"
            echo "Skill directories scanned: $scanned"
            echo "Repositories without SKILL.md: $skipped"
            echo "Scan failures: $failed"
            echo "Repositories discovered: $(wc -l < repositories.txt)"
            echo
            echo "This workflow scans AI skill directories, not every source file or package in each repository."
            echo "Static analysis only; no LLM transmission or automatic repairs."
          } > scan-summary.txt

          if [ -f clone-failures.txt ]; then
            echo "Some repositories could not be cloned." >> scan-summary.txt
          fi

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-daily-reports
          path: |
            reports/
            scan-summary.txt
            repositories.txt
            clone-failures.txt
          if-no-files-found: warn
          retention-days: 30
          
