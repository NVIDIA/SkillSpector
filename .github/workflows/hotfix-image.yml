name: Publish support hotfix image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'NVIDIA/SkillSpector'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nvidia/skillspector-hotfix
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build package image from the selected branch commit
        id: build
        shell: bash
        run: |
          BUILD_CONTEXT=$(mktemp -d)
          trap 'rm -rf "$BUILD_CONTEXT"' EXIT
          # Only committed public package inputs enter the build. Reproduce
          # support failures with synthetic examples; never upload case data.
          git archive --format=tar "$SOURCE_SHA" \
            Dockerfile.hotfix pyproject.toml README.md LICENSE src/skillspector \
            | tar -xf - -C "$BUILD_CONTEXT"
          docker build --platform linux/amd64 -f "$BUILD_CONTEXT/Dockerfile.hotfix" \
            --label "org.opencontainers.image.source=https://github.com/NVIDIA/SkillSpector" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            -t "$IMAGE:sha-$SOURCE_SHA" "$BUILD_CONTEXT"
      - name: Publish candidate, without changing any release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE:sha-$SOURCE_SHA"
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SOURCE_SHA")
          case "$DIGEST_REF" in "$IMAGE"@sha256:*) ;; *) echo 'Missing published digest'; exit 1 ;; esac
          printf 'SKILLSPECTOR_HOTFIX_IMAGE=%s\n' "$DIGEST_REF" > hotfix.env
          {
            printf '### Support hotfix candidate\n\nCommit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Review and approve this candidate in your validation system before use.\n\n```text\n'
            cat hotfix.env
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: support-hotfix-image
          path: hotfix.env
          retention-days: 7
