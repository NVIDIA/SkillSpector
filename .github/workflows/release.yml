name: Publish GitHub Release

on:
  # PyPI Trusted Publishing rejects pull_request_target events.
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: publish-github-release
  cancel-in-progress: false

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release:publish')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      distribution-artifact: release-distributions-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up uv
        # Pinned to a full commit SHA (third-party action); comment tracks the tag.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install locked build tooling
        run: uv sync --locked --extra dev --no-install-project
      - name: Build and validate distribution artifacts
        run: |
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync twine check dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/public/create_github_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --asset dist/*.whl \
            --asset dist/*.tar.gz
      - name: Save validated distributions for index publishing
        if: github.repository == 'NVIDIA/SkillSpector'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-index:
    name: Publish to Python package index
    needs: publish
    if: >-
      github.repository == 'NVIDIA/SkillSpector' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.SKILLSPECTOR_PUBLISH_INDEX == 'pypi' || vars.SKILLSPECTOR_PUBLISH_INDEX == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.SKILLSPECTOR_PUBLISH_INDEX == 'pypi' && 'pypi-production' || 'pypi-test' }}
      url: ${{ vars.SKILLSPECTOR_PUBLISH_INDEX == 'pypi' && 'https://pypi.org/project/skillspector/' || 'https://test.pypi.org/project/skillspector/' }}
    permissions:
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.publish.outputs.distribution-artifact }}
          path: dist
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: false
      - name: Upload distributions with Trusted Publishing
        env:
          PUBLISH_URL: ${{ vars.SKILLSPECTOR_PUBLISH_INDEX == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          CHECK_URL: ${{ vars.SKILLSPECTOR_PUBLISH_INDEX == 'pypi' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
        run: |
          uv publish --no-config --trusted-publishing always \
            --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" dist/*
