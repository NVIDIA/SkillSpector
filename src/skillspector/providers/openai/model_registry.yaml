# Token-budget metadata for the OpenAIProvider (stock api.openai.com or any
# OpenAI-compatible endpoint via OPENAI_BASE_URL).  Bundled with the
# package; consulted whenever the active provider is OpenAIProvider.
#
# Format:
#   models:
#     "<model-label>":
#       context_length: <int>          # total context window in tokens (required)
#       max_output_tokens: <int>       # model's max output cap (optional)
#
# Every model appears exactly once.  YAML loaders disagree on duplicate keys
# (most keep the last, strict ones raise), so a second mapping for a model
# already listed below is a bug, not an override.

models:
  # GPT-5 generation (verified 2026-09-14: openai.com/gpt-5 for 5/mini/nano;
  # developers.openai.com/api/docs/models/gpt-5.2, gpt-5.1-codex,
  # gpt-5.1-codex-max): 400K context, 128K output. The -codex entries are
  # Responses-API-only upstream; budgets listed for completeness.
  "gpt-5":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5-mini":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5-nano":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5.1":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5.1-codex":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5.1-codex-max":
    context_length: 400000
    max_output_tokens: 128000
  "gpt-5.2":
    context_length: 400000
    max_output_tokens: 128000
  # 1.05M generation (verified 2026-09-14 against
  # developers.openai.com/api/docs/models/gpt-5.4, gpt-5.5, and
  # https://platform.openai.com/docs/models): 1.05M context, 128K output.
  #
  # The per-model pricing noted below (USD per 1M tokens) is informational
  # only; SkillSpector does not compute cost.  Prompts over 272K input tokens
  # bill at 2x input / 1.5x output.
  # Source: https://developers.openai.com/api/docs/models/<model> (as of 2026-09-21)
  "gpt-5.4":
    context_length: 1050000
    max_output_tokens: 128000
  "gpt-5.5":
    context_length: 1050000
    max_output_tokens: 128000
  # $0.20 input / $0.02 cached input / $1.20 output
  "gpt-5.6-luna":
    context_length: 1050000
    max_output_tokens: 128000
  # $2.00 input / $0.20 cached input / $12.00 output
  "gpt-5.6-terra":
    context_length: 1050000
    max_output_tokens: 128000
  # $4.00 input / $0.40 cached input / $20.00 output (promotional through
  # 2026-11-21).  Input is capped at 922K tokens; the 75% input budget
  # (~787K) stays under it.
  "gpt-5.6-sol":
    context_length: 1050000
    max_output_tokens: 128000
  "gpt-5.6":  # Alias routing to gpt-5.6-sol per official docs.
    context_length: 1050000
    max_output_tokens: 128000
  "gpt-6-astra":
    context_length: 1050000
    max_output_tokens: 128000

  "gemini-3.5-flash":
    context_length: 1048576
    max_output_tokens: 65536
