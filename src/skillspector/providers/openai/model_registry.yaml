# Token-budget metadata for the OpenAIProvider (stock api.openai.com or any
# OpenAI-compatible endpoint via OPENAI_BASE_URL).  Bundled with the
# package; consulted whenever the active provider is OpenAIProvider.
#
# Format:
#   models:
#     "<model-label>":
#       context_length: <int>          # total context window in tokens (required)
#       max_output_tokens: <int>       # model's max output cap (optional)

models:
  "gpt-5.4":
    context_length: 1000000
    max_output_tokens: 128000

  # Pricing (USD per 1M tokens) is informational only; SkillSpector does not
  # compute cost.  Prompts over 272K input tokens bill at 2x input / 1.5x output.
  # Source: https://developers.openai.com/api/docs/models/<model> (as of 2026-09-21)

  # $2.00 input / $0.20 cached input / $12.00 output
  "gpt-5.6-terra":
    context_length: 1050000
    max_output_tokens: 128000

  # $0.20 input / $0.02 cached input / $1.20 output
  "gpt-5.6-luna":
    context_length: 1050000
    max_output_tokens: 128000

  "gemini-3.5-flash":
    context_length: 1048576
    max_output_tokens: 65536
